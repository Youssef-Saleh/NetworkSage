[project]
name = "networksage-x"
version = "0.1.0"
description = "Multi-agent SOC analyst with RAG, eval harness, and explainable attribution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Youssef Saleh", email = "youssef.s.saleh@gmail.com" }]

# Runtime deps are intentionally minimal. ML stack (torch, transformers,
# sentence-transformers, llama-index) is in the [ml] extra because it pulls
# in heavy wheels and is only needed for local model serving or local RAG.
dependencies = [
    "pydantic>=2.6",
    "typing-extensions>=4.10",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "transformers>=4.45",
    "sentence-transformers>=3.0",
    "llama-index>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "deepeval>=0.21",
    "ragas>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true